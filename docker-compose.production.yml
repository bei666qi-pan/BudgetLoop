name: budgetloop-production

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budgetloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: budgetloop
    volumes:
      - production-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetloop -d budgetloop"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    image: docker.m.daocloud.io/valkey/valkey:7-alpine
    restart: unless-stopped
    volumes:
      - production-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  control-plane:
    build:
      context: ./backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment: &backend-environment
      DATABASE_URL: postgresql://budgetloop:${POSTGRES_PASSWORD}@postgres:5432/budgetloop
      REDIS_URL: redis://valkey:6379/0
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
      AI_GATEWAY_TYPE: compatible
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-https://api.deepseek.com}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?AI_GATEWAY_API_KEY is required}
      AI_GATEWAY_RECOMMENDATION_MODEL: ${AI_GATEWAY_RECOMMENDATION_MODEL:-deepseek-v4-flash}
      AI_GATEWAY_DEFAULT_MODEL: ${AI_GATEWAY_DEFAULT_MODEL:-deepseek-v4-flash}
      AI_GATEWAY_READ_TIMEOUT_SECONDS: ${AI_GATEWAY_READ_TIMEOUT_SECONDS:-30}
      AI_RECOMMENDATION_ENABLED: "true"
      MANAGED_AI_RUNTIME_ENABLED: "true"
      MANAGED_AI_RUNTIME_BASE_URL: http://control-plane:8000/api/runtime/ai/v1
      MANAGED_AI_RUNTIME_CONTAINER_BASE_URL: http://host.docker.internal:8000/api/runtime/ai/v1
      ARTIFACT_BACKEND: local
      ARTIFACT_LOCAL_DIR: /data/artifacts
      AGENT_SERVER_IMAGE: ${AGENT_SERVER_IMAGE:-m.daocloud.io/ghcr.io/openhands/agent-server:latest-python}
      WORKSPACE_PUBLISHED_HOST: host.docker.internal
      TZ: Asia/Shanghai
    volumes:
      - production-artifacts:/data/artifacts
    ports:
      - "8000:8000"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: dramatiq app.worker.actors -p 1 -t 4
    environment:
      <<: *backend-environment
    volumes:
      - production-artifacts:/data/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      control-plane:
        condition: service_healthy

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      CONTROL_PLANE_API_BASE: http://control-plane:8000
      CONTROL_PLANE_API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/control/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  production-postgres:
  production-valkey:
  production-artifacts:
