name: Windows launcher

on:
  push:
    branches: ["main", "codex/**"]
    paths:
      - "VERSION"
      - "README.md"
      - "README.zh-CN.md"
      - "docs/releases/**"
      - "scripts/check_release_version.py"
      - "web/package.json"
      - "web/package-lock.json"
      - "backend/pyproject.toml"
      - "desktop/Info.plist"
      - "desktop/windows/**"
      - ".github/workflows/windows-launcher.yml"
  pull_request:
    paths:
      - "VERSION"
      - "README.md"
      - "README.zh-CN.md"
      - "docs/releases/**"
      - "scripts/check_release_version.py"
      - "web/package.json"
      - "web/package-lock.json"
      - "backend/pyproject.toml"
      - "desktop/Info.plist"
      - "desktop/windows/**"
      - ".github/workflows/windows-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release version parity
        run: python scripts/check_release_version.py
      - name: Install Tauri CLI
        run: npm ci
        working-directory: desktop/windows
      - name: Run launcher tests
        run: cargo test --manifest-path desktop/windows/src-tauri/Cargo.toml
      - name: Build Windows MSI
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop/windows
          args: --bundles msi
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: budgetloop-windows-[version]-[arch]-[bundle]
