name: Windows launcher

on:
  push:
    branches: ["codex/**"]
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-launcher.yml"
  pull_request:
    paths:
      - "desktop/windows/**"
      - ".github/workflows/windows-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: npm ci
        working-directory: desktop/windows
      - name: Run launcher tests
        run: cargo test --manifest-path desktop/windows/src-tauri/Cargo.toml
      - name: Build Windows MSI
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop/windows
          args: --bundles msi
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: budgetloop-windows-[version]-[arch]-[bundle]
