name: Real AI E2E

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - "e2e/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e-real-ai.yml"
  push:
    branches: ["test/real-deepseek-e2e"]

concurrency:
  group: real-ai-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-ai-e2e:
    name: Browser to real DeepSeek
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_MODEL: deepseek-v4-flash

    steps:
      - uses: actions/checkout@v4

      - name: Require the real provider secret
        shell: bash
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::Repository secret DEEPSEEK_API_KEY is required. Real-AI E2E never mocks or accepts the local fallback."
            exit 1
          fi

      - name: Create protected CI environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          api_token="$(openssl rand -hex 32)"
          session_secret="$(openssl rand -hex 32)"
          cat > .env <<EOF
          TZ=UTC
          POSTGRES_USER=budgetloop
          POSTGRES_PASSWORD=budgetloop-ci-password
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://budgetloop:budgetloop-ci-password@postgres:5432/budgetloop
          LITELLM_DATABASE_URL=postgresql://budgetloop:budgetloop-ci-password@postgres:5432/litellm
          REDIS_URL=redis://valkey:6379/0
          API_TOKEN=${api_token}
          CONTROL_PLANE_PORT=8000
          CONTROL_PLANE_HOST_PORT=18080
          WEB_PORT=3000
          CONTROL_PLANE_API_BASE=http://control-plane:8000
          CONTROL_PLANE_API_TOKEN=${api_token}
          NEW_API_PORT=3001
          NEW_API_SESSION_SECRET=${session_secret}
          AI_GATEWAY_TYPE=compatible
          AI_GATEWAY_BASE_URL=https://api.deepseek.com
          AI_GATEWAY_CONSOLE_URL=
          AI_GATEWAY_API_KEY=${DEEPSEEK_API_KEY}
          AI_GATEWAY_RECOMMENDATION_MODEL=deepseek-v4-flash
          AI_GATEWAY_DEFAULT_MODEL=deepseek-v4-flash
          AI_GATEWAY_DEPLOYMENT_LABEL=deepseek-production
          AI_GATEWAY_NETWORK_LABEL=github-actions
          AI_GATEWAY_REASONING_EFFORT=
          AI_GATEWAY_THINKING_ENABLED=false
          AI_GATEWAY_THINKING_BUDGET_TOKENS=0
          AI_RECOMMENDATION_ENABLED=true
          AI_GATEWAY_CONNECT_TIMEOUT_SECONDS=15
          AI_GATEWAY_READ_TIMEOUT_SECONDS=150
          MANAGED_AI_RUNTIME_ENABLED=true
          MANAGED_AI_RUNTIME_BASE_URL=http://control-plane:8000/api/runtime/ai/v1
          MANAGED_AI_RUNTIME_CONTAINER_BASE_URL=http://host.docker.internal:8000/api/runtime/ai/v1
          LITELLM_MASTER_KEY=sk-litellm-ci-only
          LITELLM_SALT_KEY=sk-litellm-salt-ci-only
          LITELLM_PORT=4000
          LLM_API_KEY=
          LLM_MODEL=
          LLM_BASE_URL=
          AGENT_SERVER_IMAGE=ghcr.io/openhands/agent-server:latest-python
          ENABLE_CLI_ENGINES=false
          BUDGETLOOP_GEMINI_CLI_SANDBOX_READY=false
          ARTIFACT_BACKEND=local
          ARTIFACT_LOCAL_DIR=/data/artifacts
          MINIO_ENDPOINT=minio:9000
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin-ci-password
          MINIO_BUCKET=budgetloop-artifacts
          EOF
          chmod 600 .env

      - name: Build and start the application chain
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --build postgres valkey new-api control-plane web

      - name: Wait for control plane and Web
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            control_ok=0
            web_ok=0
            curl -fsS --max-time 3 http://127.0.0.1:18080/api/health >/dev/null && control_ok=1 || true
            curl -fsS --max-time 3 http://127.0.0.1:3000 >/dev/null && web_ok=1 || true
            if [ "$control_ok" -eq 1 ] && [ "$web_ok" -eq 1 ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::Application did not become ready"
          docker compose ps
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package.json

      - name: Install browser test dependencies
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run real-model browser E2E
        working-directory: e2e
        run: npm test

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-ai-e2e-evidence
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Print sanitized diagnostics
        if: failure()
        shell: bash
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=300 control-plane web 2>&1 \
            | sed -E 's/sk-[A-Za-z0-9_-]+/[REDACTED]/g; s/(Authorization: Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
            || true

      - name: Remove credentials and containers
        if: always()
        shell: bash
        run: |
          docker compose down -v --remove-orphans || true
          rm -f .env
