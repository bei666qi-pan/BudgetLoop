name: Web release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Web and backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify release version parity
        run: python scripts/check_release_version.py
      - name: Fetch pinned open-source agent engines
        run: ./scripts/fetch-agent-engines.sh
      - name: Install backend
        run: python -m pip install -e ".[dev]"
        working-directory: backend
      - name: Test backend
        run: python -m pytest
        working-directory: backend
      - name: Install Web dependencies
        run: npm ci
        working-directory: web
      - name: Test Web
        run: npm test
        working-directory: web
      - name: Build Web
        run: npm run build
        working-directory: web

  publish:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          test -f "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "BudgetLoop ${TAG}" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" --verify-tag --title "BudgetLoop ${TAG}" --notes-file "$NOTES" --latest
          fi
