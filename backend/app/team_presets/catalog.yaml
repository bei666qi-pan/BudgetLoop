presets:
- id: general-project
  version: 1
  name: 通用项目团队
  category: general
  summary: 从目标澄清、执行到验证的稳健通用团队。
  best_for: 目标跨领域或暂时不确定的项目
  coordination_pattern: 主管协调 + 专家执行 + 独立验收 + 显式 Handoff
  default_workspace_policy: isolated
  industries:
  - 通用
  - 其他
  pace_tags:
  - steady
  - fast
  risk_tags:
  - steady
  - balanced
  sources:
  - autogen
  - crewai
  - langgraph
  signals: []
  agents:
    lead:
      role: 项目统筹
      goal: 维护项目计划并推动阶段交付
      backstory: 澄清目标、拆分阶段并协调风险
      skills:
      - 目标澄清
      - 任务拆解
      - 风险协调
      optional: false
      budget:
        max_total_tokens: 20000
        max_wall_time_seconds: 1200
        max_active_runtime_seconds: 600
        max_llm_calls: 20
        max_cost: 5.0
        max_parallel_llm_calls: 2
    specialist:
      role: 领域执行
      goal: 围绕项目目标完成主要执行工作
      backstory: 完成核心产出并记录依据
      skills:
      - 专业执行
      - 证据记录
      - 增量交付
      optional: false
      budget:
        max_total_tokens: 35000
        max_wall_time_seconds: 1200
        max_active_runtime_seconds: 600
        max_llm_calls: 20
        max_cost: 5.0
        max_parallel_llm_calls: 2
    reviewer:
      role: 质量评审
      goal: 发现缺口并给出可操作的修正建议
      backstory: 独立检查产出与验收标准
      skills:
      - 质量审查
      - 验收核对
      - 风险识别
      optional: false
      budget:
        max_total_tokens: 16000
        max_wall_time_seconds: 1200
        max_active_runtime_seconds: 600
        max_llm_calls: 20
        max_cost: 5.0
        max_parallel_llm_calls: 2
    research:
      role: 信息研究
      goal: 为团队提供可追溯的研究结论
      backstory: 补齐事实、竞品与约束
      skills:
      - 资料检索
      - 事实核验
      - 结论摘要
      optional: true
      budget:
        max_total_tokens: 16000
        max_wall_time_seconds: 1200
        max_active_runtime_seconds: 600
        max_llm_calls: 20
        max_cost: 5.0
        max_parallel_llm_calls: 2
  tasks:
    lead_task:
      description: 澄清目标、拆分阶段并协调风险
      expected_output: 维护项目计划并推动阶段交付
      agent: lead
    specialist_task:
      description: 完成核心产出并记录依据
      expected_output: 围绕项目目标完成主要执行工作
      agent: specialist
    reviewer_task:
      description: 独立检查产出与验收标准
      expected_output: 发现缺口并给出可操作的修正建议
      agent: reviewer
    research_task:
      description: 补齐事实、竞品与约束
      expected_output: 为团队提供可追溯的研究结论
      agent: research
  sop:
    entry: planning
    stages:
    - id: planning
      agents:
      - lead
      requires_handoff: []
      review_gate: false
    - id: research
      agents:
      - research
      requires_handoff:
      - planning
      review_gate: false
    - id: execution
      agents:
      - specialist
      requires_handoff:
      - planning
      review_gate: false
    - id: review
      agents:
      - reviewer
      requires_handoff:
      - execution
      review_gate: true
- id: software-delivery
  version: 1
  name: 软件交付团队
  category: software
  summary: 覆盖需求、架构、实现与验证的完整软件交付链路。
  best_for: 功能研发、系统重构、API 与工程交付
  coordination_pattern: 产品定义 → 架构分解 → 并行实现 → 独立测试
  default_workspace_policy: worktree
  industries:
  - 软件
  - 互联网
  - 开发
  pace_tags:
  - steady
  - fast
  risk_tags:
  - steady
  - balanced
  sources:
  - metagpt
  - langgraph
  signals:
  - label: 软件研发
    keywords:
    - 软件
    - 系统
    - 平台
    - 应用
    - app
    - website
    - 网站
    weight: 4
  - label: 工程实现
    keywords:
    - 开发
    - 代码
    - 接口
    - api
    - 重构
    - 测试
    - bug
    weight: 4
  agents:
    product:
      role: 产品负责人
      goal: 将项目目标转为可执行需求与验收清单
      backstory: 明确范围、用户路径与验收标准
      skills:
      - 需求分析
      - 范围控制
      - 验收设计
      optional: false
      budget:
        max_total_tokens: 18000
        max_wall_time_seconds: 1200
        max_active_runtime_seconds: 600
        max_llm_calls: 20
        max_cost: 5.0
        max_parallel_llm_calls: 2
    architect:
      role: 架构设计
      goal: 输出可实施架构并向实现角色 Handoff
      backstory: 设计边界、接口与关键技术决策
      skills:
      - 系统设计
      - 接口契约
      - 技术决策
      optional: false
      budget:
        max_total_tokens: 24000
        max_wall_time_seconds: 1200
        max_active_runtime_seconds: 600
        max_llm_calls: 20
        max_cost: 5.0
        max_parallel_llm_calls: 2
    backend:
      role: 后端实现
      goal: 完成后端功能并提供可验证证据
      backstory: 实现服务、数据与接口
      skills:
      - 服务开发
      - 数据建模
      - 可观测性
      optional: false
      budget:
        max_total_tokens: 40000
        max_wall_time_seconds: 1200
        max_active_runtime_seconds: 600
        max_llm_calls: 20
        max_cost: 5.0
        max_parallel_llm_calls: 2
    frontend:
      role: 前端体验
      goal: 完成可用且响应式的前端交付
      backstory: 实现界面、交互与可访问性
      skills:
      - 交互实现
      - 响应式
      - 可访问性
      optional: false
      budget:
        max_total_tokens: 35000
        max_wall_time_seconds: 1200
        max_active_runtime_seconds: 600
        max_llm_calls: 20
        max_cost: 5.0
        max_parallel_llm_calls: 2
    qa:
      role: 测试验证
      goal: 运行验收并输出缺陷与发布建议
      backstory: 独立验证功能、回归与风险
      skills:
      - 测试设计
      - 回归验证
      - 发布门禁
      optional: false
      budget:
        max_total_tokens: 22000
        max_wall_time_seconds: 1200
        max_active_runtime_seconds: 600
        max_llm_calls: 20
        max_cost: 5.0
        max_parallel_llm_calls: 2
  tasks:
    product_task:
      description: 明确范围、用户路径与验收标准
      expected_output: 将项目目标转为可执行需求与验收清单
      agent: product
    architect_task:
      description: 设计边界、接口与关键技术决策
      expected_output: 输出可实施架构并向实现角色 Handoff
      agent: architect
    backend_task:
      description: 实现服务、数据与接口
      expected_output: 完成后端功能并提供可验证证据
      agent: backend
    frontend_task:
      description: 实现界面、交互与可访问性
      expected_output: 完成可用且响应式的前端交付
      agent: frontend
    qa_task:
      description: 独立验证功能、回归与风险
      expected_output: 运行验收并输出缺陷与发布建议
      agent: qa
  sop:
    entry: discovery
    stages:
    - id: discovery
      agents:
      - product
      requires_handoff: []
      review_gate: false
    - id: architecture
      agents:
      - architect
      requires_handoff:
      - discovery
      review_gate: true
    - id: implementation
      agents:
      - backend
      - frontend
      requires_handoff:
      - architecture
      review_gate: false
    - id: review
      agents:
      - qa
      requires_handoff:
      - implementation
      review_gate: true
