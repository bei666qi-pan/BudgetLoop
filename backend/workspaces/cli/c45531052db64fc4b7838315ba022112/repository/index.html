<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预算追踪器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>💰 预算追踪器</h1>
      <p class="subtitle">管理你的每一笔收支</p>
    </header>

    <section class="summary">
      <div class="summary-card balance">
        <span class="summary-label">当前余额</span>
        <span class="summary-value" id="balance">¥0.00</span>
      </div>
      <div class="summary-card income">
        <span class="summary-label">总收入</span>
        <span class="summary-value" id="totalIncome">¥0.00</span>
      </div>
      <div class="summary-card expense">
        <span class="summary-label">总支出</span>
        <span class="summary-value" id="totalExpense">¥0.00</span>
      </div>
    </section>

    <section class="form-section">
      <h2>新增交易</h2>
      <form id="transactionForm">
        <div class="form-row">
          <div class="form-group">
            <label for="type">类型</label>
            <select id="type" required>
              <option value="">请选择</option>
              <option value="income">收入</option>
              <option value="expense">支出</option>
            </select>
          </div>
          <div class="form-group">
            <label for="amount">金额</label>
            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="category">类别</label>
            <input type="text" id="category" placeholder="如：工资、餐饮、交通" required>
          </div>
          <div class="form-group">
            <label for="date">日期</label>
            <input type="date" id="date" required>
          </div>
        </div>
        <div class="form-group full-width">
          <label for="note">备注</label>
          <input type="text" id="note" placeholder="可选备注">
        </div>
        <button type="submit" class="btn-primary">添加交易</button>
      </form>
    </section>

    <section class="list-section">
      <h2>交易记录</h2>
      <div class="filter-bar">
        <select id="filterType">
          <option value="all">全部</option>
          <option value="income">仅收入</option>
          <option value="expense">仅支出</option>
        </select>
      </div>
      <div id="transactionList" class="transaction-list">
        <p class="empty-state">暂无交易记录，快去添加一条吧！</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
