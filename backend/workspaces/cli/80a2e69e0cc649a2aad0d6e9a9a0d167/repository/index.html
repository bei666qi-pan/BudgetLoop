<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预算追踪器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>💰 预算追踪器</h1>
    </header>

    <!-- 余额统计 -->
    <section class="summary">
      <div class="summary-card balance">
        <span class="label">当前余额</span>
        <span class="value" id="balance">¥0.00</span>
      </div>
      <div class="summary-card income">
        <span class="label">总收入</span>
        <span class="value" id="totalIncome">¥0.00</span>
      </div>
      <div class="summary-card expense">
        <span class="label">总支出</span>
        <span class="value" id="totalExpense">¥0.00</span>
      </div>
    </section>

    <!-- 添加交易表单 -->
    <section class="form-section">
      <h2>添加交易</h2>
      <form id="transactionForm">
        <div class="form-row">
          <div class="form-group">
            <label for="type">类型</label>
            <select id="type" required>
              <option value="expense">支出</option>
              <option value="income">收入</option>
            </select>
          </div>
          <div class="form-group">
            <label for="amount">金额</label>
            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="category">类别</label>
            <select id="category" required>
              <optgroup label="支出类别">
                <option value="餐饮">餐饮</option>
                <option value="交通">交通</option>
                <option value="购物">购物</option>
                <option value="住房">住房</option>
                <option value="娱乐">娱乐</option>
                <option value="医疗">医疗</option>
                <option value="其他支出">其他支出</option>
              </optgroup>
              <optgroup label="收入类别">
                <option value="工资">工资</option>
                <option value="兼职">兼职</option>
                <option value="投资">投资</option>
                <option value="其他收入">其他收入</option>
              </optgroup>
            </select>
          </div>
          <div class="form-group">
            <label for="date">日期</label>
            <input type="date" id="date" required>
          </div>
        </div>
        <div class="form-group">
          <label for="notes">备注</label>
          <input type="text" id="notes" placeholder="可选备注...">
        </div>
        <button type="submit" class="btn btn-primary">添加交易</button>
      </form>
    </section>

    <!-- 交易列表 -->
    <section class="transaction-section">
      <h2>交易记录</h2>
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="搜索交易...">
        <select id="filterType">
          <option value="all">全部</option>
          <option value="income">收入</option>
          <option value="expense">支出</option>
        </select>
      </div>
      <div id="transactionList" class="transaction-list">
        <p class="empty-state">暂无交易记录，快来添加一笔吧！</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
