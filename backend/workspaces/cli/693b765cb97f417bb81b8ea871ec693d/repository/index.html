<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetLoop - 预算追踪</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>💸 BudgetLoop</h1>
      <p class="subtitle">掌控每一笔收支</p>
    </header>

    <section class="balance-card">
      <div class="balance-label">当前余额</div>
      <div class="balance-amount" id="balance">¥0.00</div>
      <div class="balance-detail">
        <div class="income-summary">
          <span class="detail-label">收入</span>
          <span class="detail-value income-color" id="totalIncome">¥0.00</span>
        </div>
        <div class="divider"></div>
        <div class="expense-summary">
          <span class="detail-label">支出</span>
          <span class="detail-value expense-color" id="totalExpense">¥0.00</span>
        </div>
      </div>
    </section>

    <section class="form-section">
      <h2>添加记录</h2>
      <form id="entryForm" autocomplete="off">
        <div class="form-row">
          <div class="form-group flex-2">
            <label for="description">描述</label>
            <input type="text" id="description" placeholder="例如：午餐、工资…" required>
          </div>
          <div class="form-group flex-1">
            <label for="amount">金额</label>
            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label for="type">类型</label>
            <select id="type" required>
              <option value="expense">支出</option>
              <option value="income">收入</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label for="category">分类</label>
            <select id="category">
              <option value="餐饮">餐饮</option>
              <option value="交通">交通</option>
              <option value="购物">购物</option>
              <option value="住房">住房</option>
              <option value="娱乐">娱乐</option>
              <option value="医疗">医疗</option>
              <option value="教育">教育</option>
              <option value="工资">工资</option>
              <option value="投资">投资</option>
              <option value="其他">其他</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">✓ 添加记录</button>
      </form>
    </section>

    <section class="filter-section">
      <div class="filter-row">
        <select id="filterType">
          <option value="all">全部类型</option>
          <option value="income">仅收入</option>
          <option value="expense">仅支出</option>
        </select>
        <select id="filterCategory">
          <option value="all">全部分类</option>
        </select>
      </div>
    </section>

    <section class="stats-section">
      <h3>分类统计</h3>
      <div class="stats-grid" id="statsGrid">
        <p class="empty-state">暂无数据</p>
      </div>
    </section>

    <section class="entries-section">
      <h3>收支记录 <span class="entry-count" id="entryCount">0</span></h3>
      <div class="entries-list" id="entriesList">
        <p class="empty-state">还没有记录，添加一条吧 ✨</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
