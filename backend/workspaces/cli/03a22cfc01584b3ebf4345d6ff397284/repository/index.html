<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预算追踪器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>💰 预算追踪器</h1>
      <div class="balance-card">
        <span class="balance-label">当前余额</span>
        <span id="balance" class="balance-amount">¥0.00</span>
      </div>
      <div class="summary">
        <div class="summary-item income">
          <span>总收入</span>
          <span id="totalIncome">¥0.00</span>
        </div>
        <div class="summary-item expense">
          <span>总支出</span>
          <span id="totalExpense">¥0.00</span>
        </div>
      </div>
    </header>

    <section class="form-section">
      <h2>添加交易</h2>
      <form id="transactionForm">
        <div class="form-row">
          <div class="form-group">
            <label for="type">类型</label>
            <select id="type" required>
              <option value="expense">支出</option>
              <option value="income">收入</option>
            </select>
          </div>
          <div class="form-group">
            <label for="amount">金额</label>
            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="category">类别</label>
            <select id="category" required>
              <option value="">请选择</option>
              <option value="餐饮">餐饮</option>
              <option value="交通">交通</option>
              <option value="购物">购物</option>
              <option value="住房">住房</option>
              <option value="娱乐">娱乐</option>
              <option value="医疗">医疗</option>
              <option value="教育">教育</option>
              <option value="工资">工资</option>
              <option value="投资">投资</option>
              <option value="其他">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label for="date">日期</label>
            <input type="date" id="date" required>
          </div>
        </div>
        <div class="form-group">
          <label for="note">备注</label>
          <input type="text" id="note" placeholder="备注（选填）">
        </div>
        <button type="submit" class="btn-add">添加交易</button>
      </form>
    </section>

    <section class="transaction-section">
      <h2>交易记录</h2>
      <div id="transactionList" class="transaction-list">
        <p class="empty-message">暂无交易记录</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
