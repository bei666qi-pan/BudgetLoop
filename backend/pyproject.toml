[project]
name = "budgetloop-backend"
version = "0.1.0"
description = "BudgetLoop: budget-aware self-healing coding agent (control plane + worker)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "dramatiq[redis]>=1.17",
    "redis>=5.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "docker>=7.1",
    "sse-starlette>=2.1",
    "minio>=7.2",
    "langgraph>=1.2,<2",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "testcontainers[postgres]>=4.7",
    "types-docker>=7.2",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.team_presets" = ["catalog.yaml"]
"app.execution_engines" = ["manifest.yaml"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=70",
]
markers = [
    "unit: Unit tests (fast, no external deps)",
    "integration: Integration tests (need PG/Docker)",
    "slow: Slow tests",
    "requires_docker: Tests that need Docker daemon",
]
