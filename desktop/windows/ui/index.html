<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BudgetLoop</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; background: #0b1020; color: #e8efff; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #193360, #0b1020 58%); }
      main { width: min(620px, calc(100vw - 48px)); padding: 48px; border: 1px solid #36538a; border-radius: 20px; background: rgb(11 20 42 / 88%); box-shadow: 0 28px 70px rgb(0 0 0 / 35%); }
      h1 { margin: 0 0 14px; font-size: 2.2rem; } p { color: #b9c9e8; line-height: 1.65; }
      #status { min-height: 3em; padding: 16px; border-radius: 12px; background: #132446; color: #d7e8ff; }
      button { margin-top: 24px; padding: 12px 18px; border: 0; border-radius: 10px; background: #66a3ff; color: #061328; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover { background: #8abaff; } code { color: #b9d5ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>BudgetLoop 正在准备</h1>
      <p>此启动器只连接本机 Docker Desktop 中的 BudgetLoop，不会上传项目或保存 API Key。</p>
      <div id="status" role="status" aria-live="polite">正在查找 BudgetLoop 仓库…</div>
      <button id="choose" type="button">选择 BudgetLoop 仓库</button>
      <p>也可预先设置 <code>BUDGETLOOP_REPO</code> 指向包含 <code>docker-compose.yml</code> 的目录。</p>
    </main>
    <script>
      const status = document.getElementById("status");
      const choose = document.getElementById("choose");
      window.__TAURI__.event.listen("launcher-status", (event) => { status.textContent = event.payload; });
      choose.addEventListener("click", async () => {
        status.textContent = "请选择 BudgetLoop 仓库…";
        try { await window.__TAURI__.core.invoke("select_repository"); }
        catch (error) { status.textContent = String(error); }
      });
    </script>
  </body>
</html>
